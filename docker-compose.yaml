services:
  # Frontend Service (Vite + Nginx)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/akuh
        VITE_RAG_API_BASE_URL: /api/rag
    ports:
      - "8000:80"
    depends_on:
      api_backend:
        condition: service_started
      rag_backend:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped

  # Main API Backend Service
  api_backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - FRONTEND_URL=http://localhost:8000,http://localhost:5173
      - RAG_API_URL=http://rag_backend:9000
    env_file:
      - ./Backend/.env
    depends_on:
      - rag_backend
    networks:
      - app-network
    restart: unless-stopped

  # RAG Backend Service
  rag_backend:
    build:
      context: ./AI_Receptionist_RAG
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - NODE_ENV=production
      - BACKEND_URL=http://localhost:5000,http://localhost:8000,http://localhost:5173,http://api_backend:5000
    env_file:
      - ./AI_Receptionist_RAG/.env
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
